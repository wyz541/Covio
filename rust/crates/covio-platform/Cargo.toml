[package]
name = "covio-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
atomic-write-file = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.7.0", default-features = false }
auto-launch = "0.6.0"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rfd = { version = "0.17.2", default-features = false }
tauri-winrt-notification = "0.8.1"
