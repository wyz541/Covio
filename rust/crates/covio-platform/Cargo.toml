[package]
name = "covio-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zeroize = "1"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.7.0", default-features = false }
atomic-write-file = "0.3.1"
auto-launch = "0.6.0"
rfd = { version = "0.17.2", default-features = false }
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
