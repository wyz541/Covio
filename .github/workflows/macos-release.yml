name: macOS full acceptance

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-acceptance:
    name: Full macOS acceptance and package
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run the full gate
        run: bash scripts/test-all.sh

      - name: Package macOS app
        run: bash scripts/package-macos-swift.sh

      - name: Show artifact boundary
        run: cat dist/macos-artifact-boundary.txt

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ github.run_id }}
          path: |
            dist/Covio-*.dmg
            dist/Covio-*.pkg
            dist/Covio-*.app.zip
            dist/CovioUpdate-*.zip
            dist/release-manifest.json
            dist/macos-artifact-boundary.txt
          if-no-files-found: error
          retention-days: 30
