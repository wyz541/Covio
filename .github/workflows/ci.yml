name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/design/previews/**"
      - "docs/research/**"
      - "guide/**"
      - "assets/Covio.iconset/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Hosted CI covers Linux and Windows. All macOS builds and acceptance run locally.
# Portable checks always run. Windows hosts run for relevant source paths.
# The package job also runs on release branches. Manual runs use the full gate.
jobs:
  windows-x64:
    name: Windows host (windows-2025-x64)
    needs: portable
    if: >-
      github.event_name != 'pull_request' ||
      needs.portable.outputs.full == 'true' ||
      needs.portable.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Record Windows environment
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture |
            Format-List

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-windows-x64-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-windows-x64-v1-${{ hashFiles('rust/Cargo.lock') }}-
            rust-windows-x64-v1-

      - name: Test Windows performance benchmark
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows-benchmark.ps1

      - name: Test Windows host
        shell: bash
        run: bash scripts/test-windows-rust.sh

      - name: Upload Windows x64 host screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-x64-${{ github.run_id }}
          path: build/windows-host-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: Windows host (windows-11-arm64)
    needs: portable
    if: >-
      github.event_name != 'pull_request' ||
      needs.portable.outputs.full == 'true' ||
      needs.portable.outputs.windows_arm == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Record Windows environment
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture |
            Format-List

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-windows-arm64-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-windows-arm64-v1-${{ hashFiles('rust/Cargo.lock') }}-
            rust-windows-arm64-v1-

      - name: Test Windows host
        shell: bash
        run: bash scripts/test-windows-rust.sh

      - name: Upload Windows ARM64 host screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-arm64-${{ github.run_id }}
          path: build/windows-host-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

  windows-package:
    name: Windows package and installer
    needs: portable
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/') ||
      needs.portable.outputs.full == 'true' ||
      needs.portable.outputs.installer == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-windows-package-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-windows-package-v1-${{ hashFiles('rust/Cargo.lock') }}-
            rust-windows-package-v1-

      - name: Read release build number
        id: release
        shell: bash
        run: |
          current="$(python3 -I scripts/release_manifest.py value buildNumber)"
          previous=$((current - 1))
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Build previous installer
        shell: bash
        env:
          COVIO_WINDOWS_BUILD_NUMBER: ${{ steps.release.outputs.previous }}
          COVIO_WINDOWS_APP_VERSION: "0.6.0-internal.${{ steps.release.outputs.previous }}"
          COVIO_WINDOWS_RELEASE_ID: "windows-installer-previous-${{ steps.release.outputs.previous }}"
          COVIO_WINDOWS_OUTPUT_DIR: "build/windows-previous"
        run: bash scripts/package-windows.sh

      - name: Build current installer
        shell: bash
        run: bash scripts/package-windows.sh

      - name: Verify Windows artifact boundary
        shell: bash
        run: bash scripts/verify-windows-artifact.sh rust/target/release/covio-windows.exe

      - name: Test clean install, upgrade, crash recovery, rollback, and uninstall
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-windows-installer.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ github.run_id }}
          path: build/windows-package/*
          if-no-files-found: error
          retention-days: 30

  portable:
    name: Portable gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      full: ${{ steps.changes.outputs.full }}
      windows: ${{ steps.changes.outputs.windows }}
      windows_arm: ${{ steps.changes.outputs.windows_arm }}
      installer: ${{ steps.changes.outputs.installer }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed areas
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          # Unknown non-doc paths fall through to the full Windows gate.
          filters: |
            full:
              - ".github/workflows/ci.yml"
              - "scripts/test-all.sh"
              - "scripts/validate-workflow.py"
              - "**"
              - "!macosApp/**"
              - "!assets/Covio.iconset/**"
              - "!assets/windows/**"
              - "!docs/**"
              - "!guide/**"
              - "!**/*.md"
              - "!.github/ISSUE_TEMPLATE/**"
              - "!LICENSE"
              - "!rust/**"
              - "!installer/windows/**"
              - "!release/release-manifest.json"
              - "!scripts/*macos*"
              - "!scripts/package-windows.sh"
              - "!scripts/verify-agent-bundle.sh"
              - "!scripts/verify-file-naming-bundle.sh"
              - "!scripts/release_manifest.py"
              - "!scripts/test-rust.sh"
              - "!scripts/test-rust-macos-ffi.sh"
              - "!scripts/test-verify-windows-artifact.sh"
              - "!scripts/test-windows-installer.ps1"
              - "!scripts/test-windows-rust.sh"
              - "!scripts/verify-windows-artifact.sh"
            windows:
              - ".github/workflows/ci.yml"
              - "assets/windows/**"
              - "rust/**"
              - "scripts/test-all.sh"
              - "scripts/test-windows-rust.sh"
              - "scripts/validate-workflow.py"
            windows_arm:
              - ".github/workflows/ci.yml"
              - "rust/Cargo.toml"
              - "rust/Cargo.lock"
              - "rust/crates/covio-platform/**"
              - "scripts/test-all.sh"
              - "scripts/test-windows-rust.sh"
              - "scripts/validate-workflow.py"
            installer:
              - ".github/workflows/ci.yml"
              - "assets/windows/**"
              - "installer/windows/**"
              - "release/release-manifest.json"
              - "scripts/package-windows.sh"
              - "scripts/release_manifest.py"
              - "scripts/test-all.sh"
              - "scripts/test-verify-windows-artifact.sh"
              - "scripts/test-windows-installer.ps1"
              - "scripts/validate-workflow.py"
              - "scripts/verify-windows-artifact.sh"
            rust:
              - ".github/workflows/ci.yml"
              - "rust/**"
              - "scripts/test-all.sh"
              - "scripts/test-rust.sh"
              - "scripts/test-rust-macos-ffi.sh"
              - "scripts/validate-workflow.py"

      - name: Check portable files
        run: |
          python3 -I scripts/release_manifest.py check
          python3 -I scripts/test_release_manifest.py
          python3 -I scripts/verify-kmp-removal.py
          python3 -I scripts/test_release_pipeline.py
          python3 -I scripts/test_release_notes.py
          python3 -I scripts/generate-update-trust.py --check
          python3 -I scripts/test_verify_macos_signing.py
          python3 -I scripts/generate-contract-constants.py --check
          python3 -I scripts/generate-workbench-interaction.py --check
          python3 -I scripts/validate-contract.py
          python3 -I scripts/validate-macos-interaction-contract.py
          python3 -I scripts/validate-workflow.py
          python3 -I scripts/file_naming_model.py verify-all

      - name: Install Rust
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-linux-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-linux-v1-${{ hashFiles('rust/Cargo.lock') }}-
            rust-linux-v1-

      - name: Test Rust workspace
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        run: bash scripts/test-rust.sh
