name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Hosted CI is the portable gate. macOS XCTest and installers run on the release Mac
# or in the manual "macOS full acceptance" workflow.
jobs:
  portable:
    name: Portable gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed areas
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            kotlin:
              - ".github/workflows/ci.yml"
              - ".github/workflows/macos-release.yml"
              - "app/**"
              - "kmpDomain/**"
              - "kotlin"
              - "libs.versions.toml"
              - "project.yaml"
              - "scripts/test-all.sh"
              - "scripts/validate-workflow.py"
            rust:
              - ".github/workflows/ci.yml"
              - ".github/workflows/macos-release.yml"
              - "rust/**"
              - "scripts/test-all.sh"
              - "scripts/test-rust.sh"
              - "scripts/test-rust-macos-ffi.sh"
              - "scripts/validate-workflow.py"

      - name: Check portable files
        run: |
          python3 -I scripts/release_manifest.py check
          python3 -I scripts/test_release_manifest.py
          python3 -I scripts/test_release_pipeline.py
          python3 -I scripts/test_release_notes.py
          python3 -I scripts/generate-update-trust.py --check
          python3 -I scripts/test_verify_macos_signing.py
          python3 -I scripts/generate-contract-constants.py --check
          python3 -I scripts/validate-contract.py
          python3 -I scripts/validate-workflow.py
          python3 -I scripts/file_naming_model.py verify-all

      - name: Set up Java
        if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Restore Kotlin cache
        if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        uses: actions/cache@v6
        with:
          path: |
            build/
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-linux-v1-${{ hashFiles('kmpDomain/module.yaml', 'app/module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-linux-v1-${{ hashFiles('kmpDomain/module.yaml', 'app/module.yaml', 'libs.versions.toml') }}-
            kotlin-linux-v1-

      - name: Test Kotlin JVM targets
        if: github.event_name != 'pull_request' || steps.changes.outputs.kotlin == 'true'
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: /bin/sh ./kotlin test --platform=jvm

      - name: Install Rust
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-linux-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-linux-v1-${{ hashFiles('rust/Cargo.lock') }}-
            rust-linux-v1-

      - name: Test Rust workspace
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        run: bash scripts/test-rust.sh
