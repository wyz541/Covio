name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    # 构建与测试不读文档目录。全仓库只有注释提到 docs/。
    # 因此纯文档改动跳过全部作业。同时改代码的 PR 照旧全跑。
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kotlin:
    name: Kotlin
    # 需要 Apple Silicon 与 Xcode 16 以上。macos-15 两者都满足。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore Kotlin caches
        id: kotlin-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ hashFiles('kmpDomain/module.yaml', 'app/module.yaml') }}-${{ github.sha }}
          restore-keys: |
            kotlin-${{ runner.os }}-${{ hashFiles('kmpDomain/module.yaml', 'app/module.yaml') }}-
            kotlin-${{ runner.os }}-
      - name: Provision Amper downloads
        run: bash scripts/provision-amper-github-downloads.sh
      - name: Build
        run: /bin/sh ./kotlin build
      - name: Test
        run: /bin/sh ./kotlin test
      - name: Save Kotlin caches
        if: always() && steps.kotlin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/Library/Caches/JetBrains/Kotlin
          key: ${{ steps.kotlin-cache.outputs.cache-primary-key }}

  checks:
    name: Contract and scripts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 发布身份与升级事务属于全量门禁，放在不依赖 Xcode 测试宿主的作业里。
      - name: Release identity tests
        run: |
          python3 -I scripts/release_manifest.py check
          python3 -I scripts/test_release_manifest.py
          python3 -I scripts/test_release_pipeline.py
          python3 -I scripts/test_release_notes.py
      # 合同常量是生成文件。改了合同忘了重跑生成器时这一步失败。
      - name: Design contract constants are current
        run: python3 -I scripts/generate-contract-constants.py --check
      # schema 表达不了的跨段规则。放在这里是为了不装 Xcode 也能快速失败。
      - name: Design contract cross-section rules
        run: python3 -I scripts/validate-contract.py
      - name: Workflow template rules
        run: python3 -I scripts/validate-workflow.py
      # 固定 helper、LaunchDaemon 和身份断言的 selftest 不需要管理员授权。
      - name: Local helper layout assertions
        run: bash scripts/verify-helper-cutover.sh selftest
      - name: Transactional installer
        run: bash scripts/test-transactional-installer.sh
      - name: File naming model manifests
        run: python3 -I scripts/file_naming_model.py verify-all

  macos-swift:
    name: macOS SwiftUI
    # 宿主的最低系统版本是 26.0。测试跑在运行器自己的系统上，
    # 所以运行器必须也是 macOS 26，否则测试二进制无法启动。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Xcode cache key
        id: xcode-cache
        shell: bash
        run: |
          version="$(xcodebuild -version | tr '\n' '-' | tr -cd '[:alnum:]._-')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore macOS caches
        id: macos-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/xcode-dd
            build/kmp-framework
            build/kmp-framework-static
            ~/Library/Caches/JetBrains/Kotlin
          key: macos-swift-${{ runner.os }}-${{ steps.xcode-cache.outputs.version }}-${{ hashFiles('macosApp/Covio.xcodeproj/project.pbxproj', 'macosApp/Covio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'kmpDomain/module.yaml', 'app/module.yaml') }}-${{ github.sha }}
          restore-keys: |
            macos-swift-${{ runner.os }}-${{ steps.xcode-cache.outputs.version }}-${{ hashFiles('macosApp/Covio.xcodeproj/project.pbxproj', 'macosApp/Covio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'kmpDomain/module.yaml', 'app/module.yaml') }}-
            macos-swift-${{ runner.os }}-${{ steps.xcode-cache.outputs.version }}-
      # Xcode 的 "Build KMP framework" 脚本阶段会自己调 Amper 与 konanc。
      - name: Build
        run: bash scripts/build-macos-swift.sh
      - name: Test
        run: bash scripts/test-macos-swift.sh
      - name: Save macOS caches
        if: always() && steps.macos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/xcode-dd
            build/kmp-framework
            build/kmp-framework-static
            ~/Library/Caches/JetBrains/Kotlin
          key: ${{ steps.macos-cache.outputs.cache-primary-key }}
