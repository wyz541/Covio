name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    # 构建与测试不读文档目录。全仓库只有注释提到 docs/。
    # 因此纯文档改动跳过全部作业。同时改代码的 PR 照旧全跑。
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# macOS XCTest runs on the release Mac. GitHub Actions only covers portable checks.
jobs:
  kotlin:
    name: Kotlin
    # 需要 Apple Silicon 与 Xcode 16 以上。macos-15 两者都满足。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore Kotlin caches
        id: kotlin-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ hashFiles('kmpDomain/module.yaml', 'app/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-${{ hashFiles('kmpDomain/module.yaml', 'app/module.yaml') }}-
            kotlin-${{ runner.os }}-
      - name: Provision Amper downloads
        run: bash scripts/provision-amper-github-downloads.sh
      - name: Build
        run: /bin/sh ./kotlin build
      - name: Test
        run: /bin/sh ./kotlin test
      - name: Save Kotlin caches
        if: always() && steps.kotlin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/Library/Caches/JetBrains/Kotlin
          key: ${{ steps.kotlin-cache.outputs.cache-primary-key }}

  checks:
    name: Contract and scripts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 发布身份与升级事务属于全量门禁，放在不依赖 Xcode 测试宿主的作业里。
      - name: Release identity tests
        run: |
          python3 -I scripts/release_manifest.py check
          python3 -I scripts/test_release_manifest.py
          python3 -I scripts/test_release_pipeline.py
          python3 -I scripts/test_release_notes.py
      # 合同常量是生成文件。改了合同忘了重跑生成器时这一步失败。
      - name: Design contract constants are current
        run: python3 -I scripts/generate-contract-constants.py --check
      # schema 表达不了的跨段规则。放在这里是为了不装 Xcode 也能快速失败。
      - name: Design contract cross-section rules
        run: python3 -I scripts/validate-contract.py
      - name: Workflow template rules
        run: python3 -I scripts/validate-workflow.py
      # 固定 helper、LaunchDaemon 和身份断言的 selftest 不需要管理员授权。
      - name: Local helper layout assertions
        run: bash scripts/verify-helper-cutover.sh selftest
      - name: Transactional installer
        run: bash scripts/test-transactional-installer.sh
      - name: File naming model manifests
        run: python3 -I scripts/file_naming_model.py verify-all
