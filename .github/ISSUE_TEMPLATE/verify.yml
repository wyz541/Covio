name: Verify
description: 跨 PR、真机或发布验收。不是普通 Task 的默认步骤。
labels: ["verify"]
body:
  - type: markdown
    attributes:
      value: |
        只在单 PR 无法完成验收时使用。
        Verify 通常是 Feature 的 sub-issue。
        使用原生 `blocked by` 指向被验收的 Task。
        Verify 不要求分支和 PR。
        单个 PR 的测试和截图仍写在 PR。

  - type: textarea
    id: acceptance
    attributes:
      label: 验收目标与场景
      description: 写用户结果和可判定场景。
      placeholder: |
        目标：升级后无需再次输入管理员密码。
        - 场景：安装迁移包 → 更新到 build 20 → 无密码提示。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据要求
      description: 写完成时必须保存的截图、日志、命令输出或真机结果。
      placeholder: |
        - macOS 版本和设备型号
        - 安装过程截图
        - 签名与版本校验命令
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境与前置条件
      description: 可选。写设备、系统、网络或数据条件。
    validations:
      required: false
