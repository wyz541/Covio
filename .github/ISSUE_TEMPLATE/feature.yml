name: Feature
description: 多 PR、超过 5 个工作日或需要先改设计的工作容器。
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Feature 是原生 sub-issue 的容器。
        不要求先建 Discussion。
        Research、Task 和例外 Verify 使用原生 sub-issue。
        Priority 和 Target date 只在 Project 8 维护。
        UI 证据写在实现后的 PR。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 写交付后用户能完成什么。
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 完成条件
      description: 写 Feature 可关闭的条件。
      placeholder: |
        - 所有 Task 已合并。
        - 真机验收通过。
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可选。写范围、UI 预期、风险或依赖。
    validations:
      required: false

  - type: input
    id: decision
    attributes:
      label: ADR
      description: "可选。已有生效 ADR 时写 `decision: ADR-NNNN`。"
      placeholder: "decision: ADR-0028"
    validations:
      required: false
