name: Research
description: 时间盒研究。回答一个问题，并把结论写回正文。
title: "research: "
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        Research 可以独立创建。
        属于 Feature 时，使用 GitHub 原生 sub-issue。
        默认时间盒是 2 个工作日，最长 3 个工作日。
        结论写回正文后关闭 Issue。
        不要填写决策占位符。

  - type: textarea
    id: question
    attributes:
      label: 待答问题
      description: 只写一个问题，并用问句表示。
      placeholder: Rust core 能否解析 `pmset` 唤醒日志？
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 预期产出
      description: 写到期时必须交出的结论或数据。
      placeholder: 一份兼容性结论和可复现证据。
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: 截止日期
      description: 使用 ISO 8601 日期。默认 2 个工作日。
      placeholder: "2026-11-05"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 可选。写为什么要问这个问题。
    validations:
      required: false

  - type: textarea
    id: conclusion
    attributes:
      label: 结论
      description: 可选。结题时写结论、依据和后续动作。
    validations:
      required: false
