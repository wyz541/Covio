name: Bug
description: 可复现的缺陷。说明实际行为、预期行为和修复验收。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        可复现的缺陷直接使用本表单。不要求先建 Discussion。
        一个 Bug 对应一条分支和一个 PR。
        Bug 需要多个 PR 或先改设计时，另建 Parent Feature，并拆成 Task sub-issue。

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 写现在发生了什么。只写可观察结果。
      placeholder: |
        例如：开启夜间模式后，风扇转速仍使用白天的规则。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 写正确行为是什么。
      placeholder: |
        例如：开启夜间模式后，风扇转速使用夜间规则。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一行一个动作。最后一行写观察到的结果。
      placeholder: |
        1. 打开设置。
        2. 开启夜间模式。
        3. 查看风扇转速。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 写明版本、设备、macOS 和必要条件。
      placeholder: |
        - Covio：<版本或 commit>
        - 设备：<型号>
        - 系统：macOS <version>
        - 其他条件：<条件>
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 一行一条。每条必须可判定。
      placeholder: |
        - 验收：按上述步骤操作时，不再出现实际行为。
        - 验收：原有行为没有回归。
    validations:
      required: true

  - type: dropdown
    id: estimated_days
    attributes:
      label: 预计工期
      options:
        - 1 天
        - 2 天
        - 3 天
    validations:
      required: true

  - type: dropdown
    id: ui_type
    attributes:
      label: UI 类型
      description: UI 代码变更的真机证据在 PR 提供。
      options:
        - 不涉及 UI
        - UI 代码变更
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 日志、截图、关联 issue 或已知线索。没有时留空。
    validations:
      required: false
