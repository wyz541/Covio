name: Bug
description: 可复现的缺陷。一个会话能修复时直接创建。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        一个 Bug 对应一条分支和一个 PR。
        Bug 需要多个 PR 时，改用 Feature。
        UI 截图写在实现后的 PR。

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 只写现在可观察到的结果。
      placeholder: 开启夜间模式后，风扇仍使用白天规则。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 写正确结果。
      placeholder: 开启夜间模式后，风扇使用夜间规则。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一行一个动作。最后一行写观察结果。
      placeholder: |
        1. 打开设置。
        2. 开启夜间模式。
        3. 查看风扇转速。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 可选。写版本、设备和系统。
      placeholder: |
        - Covio：<版本或 commit>
        - 设备：<型号>
        - 系统：macOS <version>
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可选。写日志、截图或已知线索。
    validations:
      required: false
