name: Task
description: 一个会话可完成的小任务或 Feature sub-issue。
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        一个 Task 对应一条分支和一个 PR。
        小任务可以直接创建，不要求 Discussion 或 Feature。
        属于 Feature 时，使用 GitHub 原生 sub-issue。
        UI 证据写在实现后的 PR。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 写交付后用户能完成什么。
      placeholder: 用户可以关闭自动更新。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 一行一个结果。每条必须可判定。
      placeholder: |
        - 用户可以关闭自动更新。
        - 重启应用后设置保持。
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可选。写 UI 状态、预览、依赖或已知风险。
    validations:
      required: false
